{# admin/templates/clients/_navigation.html #}

<div class="card mb-4">

  <div class="card-body py-3">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3">

      <div>
        <h4 class="mb-1">
          <i class="fa fa-building me-2 text-primary"></i>
          {{ locals.client.name }}
        </h4>

        <div class="text-muted small">
          <i class="fa fa-user me-1"></i>
          {{ locals.client.contact_name }}
          {% if locals.client.email %}
            <span class="mx-2">|</span>
            <i class="fa fa-envelope me-1"></i>
            {{ locals.client.email }}
          {% endif %}
        </div>
      </div>

      <a href="/admin/clients"
         class="btn btn-outline-secondary btn-sm">
        <i class="fa fa-arrow-left me-1"></i>
        Volver
      </a>

    </div>

  </div>

  <ul class="nav nav-tabs px-3">

    <li class="nav-item">
      <a class="nav-link {% if active_tab == 'info' %}active{% endif %}"
         href="/admin/clients/{{ locals.client.id }}/edit">
        <i class="fa fa-user me-1"></i>
        Información
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if active_tab == 'workers' %}active{% endif %}"
         href="/admin/clients/{{ locals.client.id }}/workers">
        <i class="fa fa-users me-1"></i>
        Trabajadores
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if active_tab == 'machines' %}active{% endif %}"
         href="/admin/clients/{{ locals.client.id }}/machines">
        <i class="fa fa-cogs me-1"></i>
        Máquinas
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if active_tab == 'managers' %}active{% endif %}"
         href="/admin/clients/{{ locals.client.id }}/managers">
        <i class="fa fa-user-tie me-1"></i>
        Encargados
      </a>
    </li>

  </ul>

</div>
